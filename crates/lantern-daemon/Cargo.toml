[package]
name = "lantern-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol = { version = "5.2.0", features = ["process"] }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lantern-core = { version = "0.1.0", path = "../lantern-core" }
rmcp = { version = "3.9.0", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
